name: Build Windows

env:
  ARTIFACT_RETENTION_DAYS: 7

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-windows.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: "yarn"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare native caches
        id: native-cache
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:RUNNER_TEMP "hydra-vcpkg-archives"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheDir" >> $env:GITHUB_ENV
          $arch = $env:RUNNER_ARCH.ToLowerInvariant()
          $image = "$env:ImageOS-$env:ImageVersion"
          "image=$image" >> $env:GITHUB_OUTPUT
          "prefix=v1-vcpkg-$env:RUNNER_OS-$image-$arch-$arch-windows-static" >> $env:GITHUB_OUTPUT

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/hydra-native -> target
          shared-key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache.outputs.image }}
          cache-bin: false

      - name: Restore vcpkg binary packages
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.native-cache.outputs.prefix }}-${{ hashFiles('native/torrent-bridge/**/vcpkg*.json', 'native/torrent-bridge/**/triplets/**') }}
          restore-keys: |
            ${{ steps.native-cache.outputs.prefix }}-

      - name: Install dependencies
        run: yarn --frozen-lockfile

      # Save before packaging so later failures do not discard compiled dependencies.
      - name: Save vcpkg binary packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # The fork's backend URLs live in repository secrets (mirroring the local
      # .env) so they are masked in logs. Never publish to the upstream release.
      - name: Build Windows
        run: yarn build:win --publish never
        env:
          MAIN_VITE_API_URL: ${{ secrets.MAIN_VITE_API_URL }}
          MAIN_VITE_AUTH_URL: ${{ secrets.MAIN_VITE_AUTH_URL }}
          MAIN_VITE_WS_URL: ${{ secrets.MAIN_VITE_WS_URL }}
          MAIN_VITE_NIMBUS_API_URL: ${{ secrets.MAIN_VITE_NIMBUS_API_URL }}
          MAIN_VITE_LAUNCHER_SUBDOMAIN: ${{ secrets.MAIN_VITE_LAUNCHER_SUBDOMAIN }}
          RENDERER_VITE_REAL_DEBRID_REFERRAL_ID: ${{ secrets.RENDERER_VITE_REAL_DEBRID_REFERRAL_ID }}
          RENDERER_VITE_TORBOX_REFERRAL_CODE: ${{ secrets.RENDERER_VITE_TORBOX_REFERRAL_CODE }}

      - name: Create artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-windows
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          compression-level: 0
          path: |
            dist/*-setup.exe
            dist/*-portable.exe
            dist/*.yml
            dist/*.blockmap
